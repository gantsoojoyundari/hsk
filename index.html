<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffc2dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#ffc2dc" media="(prefers-color-scheme: dark)" />
    <title>HSK Sprint</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // Анивчихгүйн тулд сэдвийг render-ээс өмнө тогтооно.
      try {
        var ses = JSON.parse(localStorage.getItem("hsk-sprint:session")) || {};
        var key = ses.name ? "hsk-sprint:u:" + ses.name.trim().toLowerCase() : "";
        var st = (key && JSON.parse(localStorage.getItem(key))) || {};
        st = st.settings || {};
        // Ягаан theme-ээс өмнөх хэрэглэгч: цайвар ягаанаар эхэлнэ (store.js migrate-тэй ижил).
        var t = st.pinkTheme ? st.theme : "light";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
